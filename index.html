<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MESAJHUB</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Helvetica, sans-serif; }
        body { background-color: #0b141a; min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #e9edef; padding: 10px; }
        .box { background: #111b21; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); width: 100%; max-width: 450px; text-align: center; display: none; border: 1px solid #222e35; }
        #login-screen { display: block; border-top: 5px solid #00a884; }
        h2 { margin-bottom: 20px; font-weight: bold; color: #00a884; letter-spacing: 1px; font-size: 24px; }
        input[type="password"], input[type="text"] { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #222e35; background: #2a3942; border-radius: 8px; color: #fff; font-size: 16px; outline: none; text-align: center; }
        input::placeholder { color: #8696a0; }
        button { width: 100%; background: #00a884; color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #008f72; }
        .error { color: #f15c6d; margin-bottom: 15px; font-size: 14px; font-weight: bold; display: none; }
        #loading-screen h1 { font-size: 20px; color: #00a884; margin-bottom: 15px; }
        .countdown { font-size: 32px; font-weight: bold; color: #e9edef; margin: 15px 0; }
        .spinner { width: 45px; height: 45px; border: 4px solid #222e35; border-radius: 50%; border-top-color: #00a884; animation: spin 1s infinite linear; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #welcome-screen { max-width: 480px; padding: 15px; display: none; flex-direction: column; background-image: url('https://githubusercontent.com'); background-color: #0b141a; position: relative; }
        .chat-header { background: #202c33; padding: 12px; margin: -15px -15px 15px -15px; border-radius: 12px 12px 0 0; text-align: left; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #2a3942; }
        .chat-header-title { font-weight: bold; color: #e9edef; font-size: 16px; }
        .chat-header-status { font-size: 12px; color: #8696a0; }
        .chat-area { height: 320px; overflow-y: auto; padding: 10px; text-align: left; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg-bubble { max-width: 85%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; position: relative; color: #e9edef; word-break: break-all; }
        .msg-sent { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .msg-received { background: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        .msg-meta { font-size: 11px; color: #f1c40f; font-weight: bold; margin-bottom: 3px; display: block; }
        .msg-time { font-size: 10px; color: #8696a0; text-align: right; display: block; margin-top: 4px; }
        .chat-input-group { display: flex; gap: 8px; background: #202c33; padding: 10px; margin: 0 -15px -15px -15px; border-radius: 0 0 12px 12px; }
        .chat-input-group input { margin-bottom: 0; background: #2a3942; border: none; text-align: left; padding: 12px; border-radius: 8px; }
        .chat-input-group button { width: 70px; background: #00a884; padding: 0; display: flex; justify-content: center; align-items: center; }
        .key-badge { position: absolute; bottom: 65px; left: 15px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; font-size: 11px; color: #8696a0; border: 1px solid #222e35; z-index: 10; pointer-events: none; }
        #admin-screen { max-width: 750px; background: #111b21; color: #e9edef; text-align: left; border-top: 5px solid #f15c6d; }
        #admin-screen h2 { color: #f15c6d; border-bottom: 1px solid #222e35; padding-bottom: 10px; margin-bottom: 15px; }
        .stats-bar { display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center; }
        .stats { background: #202c33; padding: 8px 15px; border-radius: 6px; font-weight: bold; font-size: 14px; border: 1px solid #2a3942; }
        .btn-clear { background: #ea0038; width: auto; padding: 8px 15px; font-size: 14px; }
        .btn-clear:hover { background: #c2002f; }
        .table-wrapper { width: 100%; overflow-x: auto; background: #111b21; border-radius: 8px; border: 1px solid #222e35; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #202c33; color: #8696a0; padding: 12px; font-size: 13px; text-transform: uppercase; border-bottom: 1px solid #2a3942; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #222e35; font-size: 13px; color: #d1d7db; }
        .ip-badge { font-family: monospace; font-weight: bold; color: #f15c6d; background: rgba(241,92,109,0.1); padding: 3px 6px; border-radius: 4px; }
        .id-badge { font-weight: bold; color: #00a884; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-screen" class="box">
        <h2>MESAJHUB</h2>
        <div id="error-msg" class="error">Geçersiz Kod Girdiniz!</div>
        <input type="password" id="site-password" placeholder="Erişim kodunu yazın...">
        <button onclick="sistemeGirisYap()">Giriş Yap</button>
    </div>

    <!-- 10 SANİYE BEKLEME EKRANI -->
    <div id="loading-screen" class="box">
        <h1>Bağlantı Kuruluyor...</h1>
        <p style="color: #8696a0; font-size: 14px;">Lütfen bekleyin</p>
        <div class="countdown" id="timer-text">10</div>
        <div class="spinner"></div>
    </div>

    <!-- SOHBET ALANI -->
    <div id="welcome-screen" class="box">
        <div class="chat-header">
            <div style="width: 35px; height: 35px; background: #00a884; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px;">MH</div>
            <div>
                <div class="chat-header-title" id="chat-title-display">Sohbet Odası</div>
                <div class="chat-header-status">çevrimiçi</div>
            </div>
        </div>
        <div class="chat-area" id="chat-window"></div>
        <div class="key-badge" id="mobile-key-badge">Key: -</div>
        <div class="chat-input-group">
            <input type="text" id="chat-message" placeholder="Mesaj yazın..." onkeypress="if(event.keyCode===13) mesajGonder()">
            <button onclick="mesajGonder()">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M1.101 21.757L23.8 12.028 1.101 2.3 l.011 7.912 13.623 1.816-13.623 1.817z"></path></svg>
            </button>
        </div>
    </div>

    <!-- GİZLİ ADMİN PANELİ -->
    <div id="admin-screen" class="box">
        <h2>Yönetici Takip Paneli 📊</h2>
        <div class="stats-bar">
            <div class="stats">Toplam Giriş: <span id="total-count">0</span></div>
            <button class="btn-clear" onclick="loglariTemizle()">Sistem Verilerini Sıfırla</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr><th>Atanan ID</th><th>IP Adresi</th><th>Tarayıcı / Cihaz</th><th>Tarih</th></tr>
                </thead>
                <tbody id="log-table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const KEY_1 = "ABD.2026"; 
        const KEY_2 = "ABD.2012"; 
        const ADMIN_KEY = "GRTP.12";
        let ziyaretciIP = "Alınamadı (Ağ Engeli)";
        let cihazBilgisi = navigator.userAgent.split(") ") + ")";
        let aktifID = "";
        let kullanilanKey = "";
        let sonMesajSayisi = 0;

        fetch('https://ipify.org')
            .then(response => response.json())
            .then(data => { ziyaretciIP = data.ip; })
            .catch(() => { ziyaretciIP = "Gizli / Algılanamadı"; });

        function CorporateLog(userID, ip, cihaz) {
            let mevcutLoglar = JSON.parse(localStorage.getItem("site_loglari")) || [];
            let yeniKayit = { uid: userID, ip: ip, cihaz: cihaz, tarih: new Date().toLocaleString('tr-TR') };
            mevcutLoglar.push(yeniKayit);
            localStorage.setItem("site_loglari", JSON.stringify(mevcutLoglar));
        }

        function sistemeGirisYap() {
            const girilenSifre = document.getElementById("site-password").value.trim();
            const hataMesaji = document.getElementById("error-msg");

            if (girilenSifre === KEY_1 || girilenSifre === KEY_2) {
                hataMesaji.style.display = "none";
                document.getElementById("login-screen").style.display = "none";
                aktifID = (girilenSifre === KEY_1) ? "4356" : "3131";
                kullanilanKey = girilenSifre;
                
                document.getElementById("loading-screen").style.display = "block";
                let sure = 10;
                const sayac = setInterval(() => {
                    sure--;
                    document.getElementById("timer-text").innerText = sure;
                    if (sure <= 0) { clearInterval(sayac); ZiyaretciEkraniniAc(); }
                }, 1000);
            } else if (girilenSifre === ADMIN_KEY) {
                hataMesaji.style.display = "none";
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("admin-screen").style.display = "block";
                tabloyuYenile();
            } else { hataMesaji.style.display = "block"; }
        }

        function ZiyaretciEkraniniAc() {
            document.getElementById("loading-screen").style.display = "none";
